[package]
name = "rem-exec"
version = "0.1.0"
edition = "2024"
description = "Agent-friendly remote process execution"

[lib]
name = "rem_exec"
path = "src/lib.rs"

[[bin]]
name = "rem-exec"
path = "src/bin/rem-exec.rs"

[[bin]]
name = "rem-execd"
path = "src/bin/rem-execd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
libc = "0.2"
