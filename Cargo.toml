[package]
name = "rem-exec"
version = "0.4.0"
edition = "2024"
description = "Agent-friendly remote process execution"
license = "MIT"
repository = "https://github.com/kwinsch/rem-exec"
readme = "README.md"
keywords = ["ssh", "remote", "execution", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".cargo/",
    "SENSITIVE.md",
    "test-confirm.sh",
]

[lib]
name = "rem_exec"
path = "src/lib.rs"

[[bin]]
name = "rx"
path = "src/bin/rx.rs"

[[bin]]
name = "rxd"
path = "src/bin/rxd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: emit object keys in insertion order rather than sorted, so
# `type` leads every response. Sorted keys buried the discriminant mid-object
# for anything built with json!() while struct-derived responses led with it —
# the same error reading two different ways on consecutive commands.
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
libc = "0.2"
