[package]
name = "rem-exec"
version = "0.2.1"
edition = "2024"
description = "Agent-friendly remote process execution"
license = "MIT"
repository = "https://github.com/kwinsch/rem-exec"
readme = "README.md"
keywords = ["ssh", "remote", "execution", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".cargo/",
    "SENSITIVE.md",
    "test-confirm.sh",
]

[lib]
name = "rem_exec"
path = "src/lib.rs"

[[bin]]
name = "rx"
path = "src/bin/rx.rs"

[[bin]]
name = "rxd"
path = "src/bin/rxd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
libc = "0.2"
